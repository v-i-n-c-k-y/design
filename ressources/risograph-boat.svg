<?xml version="1.0" encoding="UTF-8"?>
<svg width="1080" height="1480" viewBox="0 0 1080 1480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Palette -->
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7aa2"/>
      <stop offset="100%" stop-color="#ffa26b"/>
    </linearGradient>

    <!-- Grain / Riso texture -->
    <filter id="grain" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" />
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 0.15"/>
      </feComponentTransfer>
    </filter>

    <!-- Halftone-like dots -->
    <pattern id="dots" patternUnits="userSpaceOnUse" width="12" height="12">
      <circle cx="2" cy="2" r="1.2" fill="#1b4cff" opacity="0.25"/>
      <circle cx="8" cy="8" r="1.2" fill="#1b4cff" opacity="0.2"/>
    </pattern>

    <!-- Boat wood texture (simple hatch) -->
    <pattern id="hatch" patternUnits="userSpaceOnUse" width="10" height="6" patternTransform="rotate(-8)">
      <rect width="10" height="6" fill="none"/>
      <path d="M0,3 h10" stroke="#1d2766" stroke-width="1" opacity="0.35"/>
    </pattern>

    <!-- Drop shadow -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0d0b2a" flood-opacity="0.35"/>
    </filter>

    <!-- Thick riso-style stroke -->
    <style>
      .ink { stroke:#1b3aa3; stroke-width:6; stroke-linejoin:round; stroke-linecap:round; }
      .ink-thin { stroke:#1b3aa3; stroke-width:4; stroke-linejoin:round; stroke-linecap:round; }
    </style>
  </defs>

  <!-- Cream border -->
  <rect x="0" y="0" width="1080" height="1480" fill="#f4eadc"/>

  <!-- Sky -->
  <rect x="60" y="60" width="960" height="1200" rx="24" fill="url(#skyGrad)"/>
  <!-- Sky dots overlay -->
  <rect x="60" y="60" width="960" height="1200" rx="24" fill="url(#dots)" />

  <!-- Sun -->
  <g filter="url(#softShadow)">
    <circle cx="880" cy="260" r="70" fill="#ffd2a3" stroke="#1b3aa3" stroke-width="6"/>
    <circle cx="880" cy="260" r="70" fill="url(#dots)" opacity="0.45"/>
  </g>

  <!-- Clouds -->
  <g fill="#ffc3d1" stroke="#1b3aa3" stroke-width="6" opacity="0.95">
    <path d="M210 260c16-34 68-34 84 0 16-24 58-24 74 0 34-8 56 10 56 34 0 28-28 48-70 48h-132c-38 0-54-22-54-40 0-22 16-34 42-42z"/>
    <path d="M370 360c12-24 44-24 56 0 12-18 40-18 52 0 24-6 40 8 40 26 0 22-20 36-50 36h-100c-30 0-42-16-42-30s12-24 30-32z"/>
  </g>

  <!-- Water -->
  <rect x="60" y="1020" width="960" height="240" fill="#2a4cff" filter="url(#grain)" opacity="0.75"/>
  <g fill="none" class="ink-thin" opacity="0.9">
    <path d="M100,1120 C160,1100 220,1140 280,1120 S400,1120 460,1120 580,1140 640,1120 760,1120 820,1120 940,1140 1000,1120" />
    <path d="M100,1155 C160,1135 220,1175 280,1155 S400,1155 460,1155 580,1175 640,1155 760,1155 820,1155 940,1175 1000,1155" />
    <path d="M100,1190 C160,1170 220,1210 280,1190 S400,1190 460,1190 580,1210 640,1190 760,1190 820,1190 940,1210 1000,1190" />
  </g>

  <!-- Boat group -->
  <g transform="translate(180,760)">
    <!-- Hull -->
    <g filter="url(#softShadow)">
      <path id="hull" d="M70,260 C180,330 410,330 520,260 520,260 500,340 420,380 340,420 250,430 160,400 100,380 80,350 70,260 Z"
            fill="#ff7b2e" />
      <use href="#hull" fill="url(#hatch)" opacity="0.55"/>
      <use href="#hull" fill="none" class="ink"/>
    </g>

    <!-- Mast -->
    <line x1="300" y1="90" x2="300" y2="330" class="ink"/>
    <line x1="300" y1="120" x2="120" y2="260" class="ink"/>
    <line x1="300" y1="120" x2="520" y2="250" class="ink"/>

    <!-- Sails -->
    <path id="mainsail" d="M300,120 L300,330 L90,260 Z" fill="#ff7aa2"/>
    <use href="#mainsail" fill="url(#dots)" opacity="0.6"/>
    <path d="M300,120 L300,330 L90,260 Z" fill="none" class="ink"/>

    <path id="jib" d="M300,120 L300,260 L520,250 Z" fill="#ffd2a3"/>
    <use href="#jib" fill="url(#dots)" opacity="0.5"/>
    <path d="M300,120 L300,260 L520,250 Z" fill="none" class="ink"/>

    <!-- Gunwale detail -->
    <path d="M90,260 C200,320 420,320 520,260" fill="none" class="ink"/>
    <!-- Rudder line -->
    <path d="M520,260 Q540,288 520,300" fill="none" class="ink-thin"/>
  </g>

  <!-- Overall grain overlay -->
  <rect x="60" y="60" width="960" height="1200" rx="24" fill="#000" filter="url(#grain)"/>

  <!-- Frame -->
  <rect x="60" y="60" width="960" height="1200" rx="24" fill="none" class="ink"/>
</svg>
